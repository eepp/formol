[project]
name = 'formol'
version = '0.9.0'
description = 'Plain text beautifier'
readme = {file = 'README.adoc', content-type = 'text/plain'}
license = 'MIT'
authors = [{name = 'Philippe Proulx', email = 'eeppeliteloop@gmail.com'}]
requires-python = '>=3.9'
classifiers = [
    'Development Status :: 4 - Beta',
    'Intended Audience :: Developers',
    'Operating System :: OS Independent',
    'Topic :: Software Development :: Documentation',
]

[project.urls]
Repository = 'https://github.com/eepp/formol/'
'Bug tracker' = 'https://github.com/eepp/formol/issues/'

[build-system]
requires = ['hatchling']
build-backend = 'hatchling.build'

[dependency-groups]
dev = ['pytest']

[tool.hatch.build.targets.wheel]
only-include = ['formol.py']

[tool.hatch.build.targets.sdist]
include = ['formol.py', 'README.adoc', 'tests']
